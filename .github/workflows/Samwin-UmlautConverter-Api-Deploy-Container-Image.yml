name: Samwin UmlautConverter Api Deploy Container Image

on:
  workflow_run: # would run when all workflows are present in default branch
    workflows: ["Samwin UmlautConverter Build, Test & Coverage"]
    types:
      - completed
  workflow_dispatch: # allows manual trigger

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Run if triggered manually/push, OR if triggered by workflow_run and it succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update Render Environment Variables
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          TOKEN_KEY: ${{ secrets.JwtSettings__TokenKey }}
          TOKEN_ISSUER: ${{ vars.JwtSettings__TokenIssuer }}
          TOKEN_AUDIENCE: ${{ vars.JwtSettings__TokenAudience }}
        run: |
          # construct JSON payload safely using jq to handle special chars in secrets
          jq -n \
            --arg key "$TOKEN_KEY" \
            --arg issuer "$TOKEN_ISSUER" \
            --arg audience "$TOKEN_AUDIENCE" \
            '[ {key: "JwtSettings__TokenKey", value: $key}, {key: "JwtSettings__TokenIssuer", value: $issuer}, {key: "JwtSettings__TokenAudience", value: $audience} ]' > env_vars.json

          # Push to Render API
          curl -X PUT "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d @env_vars.json

      - name: Trigger Render Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
