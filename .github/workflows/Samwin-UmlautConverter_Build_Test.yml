name: Samwin UmlautConverter Build, Test & Coverage

on:
  push:
    branches: [ advance ] # Add other branches you want to deploy reports for
    paths-ignore:
      - 'README.md'
      - '*.md'    
  pull_request:
    branches: [ advance ] # Match the branches from the push trigger
    paths-ignore:
      - 'README.md'
      - '*.md'    
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Samwin.UmlautConverter.sln

    - name: Run code analysis
      run: |
        echo "##[group]Code Analysis Warnings (just for demo purposes, not actual analyzers configured)"
        echo "Running analyzers via dotnet build..."
        dotnet build src/Samwin.UmlautConverterLib/Samwin.UmlautConverterLib.csproj --no-restore --configuration Release
        echo "##[endgroup]"

    - name: Build
      run: dotnet build src/Samwin.UmlautConverter.sln --configuration Release --no-restore

    - name: Run tests with coverage
      run: |
        dotnet test src/Samwin.UmlautConverterLib.Tests/Samwin.UmlautConverterLib.Tests.csproj --configuration Release --framework net10.0 --collect:"XPlat Code Coverage" --settings coverage.runsettings --verbosity normal
        dotnet test src/Samwin.UmlautConverter.Api.Tests/Samwin.UmlautConverter.Api.Tests.csproj --configuration Release --framework net10.0 --collect:"XPlat Code Coverage" --settings coverage.runsettings --verbosity normal

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Generate HTML coverage report and badge
      run: dotnet tool run reportgenerator -reports:"src/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Html;TextSummary;Badges"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/

    - name: Deploy Coverage to GitHub Pages
      # Only run on a push event to a branch, not on pull requests
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./coverage-report
        destination_dir: ${{ github.ref_name }} # Publish to a branch-specific directory

    - name: Add Coverage Report Link to Job Summary
      if: github.event_name == 'push'
      run: |
        echo "### 📊 Live Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "A live [HTML coverage report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.ref_name }}/) has been deployed for the **${{ github.ref_name }}** branch." >> $GITHUB_STEP_SUMMARY

    - name: Commit coverage badge
      run: |
        mkdir -p badges
        cp coverage-report/badge_linecoverage.svg badges/coverage.svg

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add badges/coverage.svg
        git commit -m "chore: update coverage badge [skip ci]" || echo "No changes"

        git push

    - name: Display coverage summary in log
      run: |
        echo "##[group]Code Coverage Summary"
        dotnet tool run reportgenerator -reports:"src/**/coverage.cobertura.xml" -targetdir:coverage-summary -reporttypes:TextSummary
        cat coverage-summary/Summary.txt
        echo "##[endgroup]"
        
    
    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: src/**/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both