name: Samwin UmlautConverter Build, Test & Coverage

on:
  push:
    branches: [ core ]
  pull_request:
    branches: [ core ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Samwin.UmlautConverter.sln

    - name: Build
      run: dotnet build src/Samwin.UmlautConverter.sln --configuration Release --no-restore

    - name: Run tests with coverage
      run: |
        mkdir -p coverage-report
        dotnet test src/Samwin.UmlautConverterLib.Tests/Samwin.UmlautConverterLib.Tests.csproj \
          --configuration Release --framework net10.0 --collect:"XPlat Code Coverage" \
          /p:CoverletOutput=coverage-report/coverage.cobertura.xml \
          /p:CoverletOutputFormat=cobertura

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Generate HTML coverage report
      run: dotnet tool run reportgenerator -reports:coverage-report/coverage.cobertura.xml -targetdir:coverage-report/html -reporttypes:Html

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/html

    - name: Display coverage summary in log
      run: |
        echo "##[group]Code Coverage Summary"
        dotnet tool run reportgenerator -reports:coverage-report/coverage.cobertura.xml -targetdir:coverage-summary -reporttypes:TextSummary
        cat coverage-summary/Summary.txt
        echo "##[endgroup]"