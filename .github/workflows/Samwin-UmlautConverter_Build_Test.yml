name: Samwin UmlautConverter Build, Test & Coverage

on:
  push:
    branches: [ core ]
  pull_request:
    branches: [ core ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Samwin.UmlautConverter.sln

    - name: Build
      run: dotnet build src/Samwin.UmlautConverter.sln --configuration Release --no-restore

    - name: Run code analysis
      run: |
        echo "##[group]Code Analysis Warnings (Just to demo static analysis integration)"
        echo "Running analyzers via dotnet build..."
        dotnet build src/Samwin.UmlautConverterLib/Samwin.UmlautConverterLib.csproj --no-restore --configuration Release /p:RunAnalyzersDuringBuild=true /p:TreatWarningsAsErrors=false /v:detailed

        echo ""
        echo "Running dotnet format to catch cross-platform analyzer issues..."
        dotnet tool restore
        dotnet format src/Samwin.UmlautConverterLib/Samwin.UmlautConverterLib.csproj --verify-no-changes || true
        echo "##[endgroup]"

    - name: Run tests with coverage
      run: dotnet test src/Samwin.UmlautConverterLib.Tests/Samwin.UmlautConverterLib.Tests.csproj --configuration Release --framework net10.0 --collect:"XPlat Code Coverage" --verbosity normal

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Generate HTML coverage report
      run: dotnet tool run reportgenerator -reports:"src/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:Html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/
    
    - name: Display coverage summary in log
      run: |
        echo "##[group]Code Coverage Summary"
        dotnet tool run reportgenerator -reports:"src/**/coverage.cobertura.xml" -targetdir:coverage-summary -reporttypes:TextSummary
        cat coverage-summary/Summary.txt
        echo "##[endgroup]"